<html>
<head>
    <!-- Title -->
    <title>Vinícius Gabriel&nbsp;&#124;&nbsp;Monambike</title>
    <!-- Meta Tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Vinícius Gabriel Marques de Melo">
    <meta name="application-name" content="Monambike Website">
    <meta name="description" content="This is my personal website. I'm a programmer, passionate gamer, born in Ribeirão Preto (SP). Every day, I strive to improve both in my field and in my perception of the world around me.">
    <meta name="keywords" content="monambike, vinicius-gabriel, vinicius, site-pessoal, curriculo, programacao, desenvolvedor, desenvolvimento-web, inicio, pagina-inicial">
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/main.css" rel="stylesheet" />
    <!-- Website Icons -->
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <!-- Javascript Blazor Frameswork -->
    <!-- Comment this line if you need to manipulate the loading screen -->
    <script src="_framework/blazor.webassembly.js" defer></script>

    <script src="javascript/animation-rainstorm.js" defer></script>

<body>
    <!-- App Body Content -->
    <div id="app">
        <!-- Loading Screen -->
        <div class="loading">
            <div class="loading__background">
                <div class="loading__body">
                    <div class="loading__title">

                    </div>

                    <div class="loading__description">

                    </div>
                    <div class="loading__curiosity">
                        <span><b>Curiosidade do momento...</b></span><br />
                        <span>Camarões são feitos de carangueijo :P</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Blazor error message -->
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
